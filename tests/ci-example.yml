# GitHub Actions example. Copy to .github/workflows/test.yml to run smoke tests on every push.
# (Adding workflow files needs a token with the "workflows" permission, so it is not committed by default.)
name: test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python tests/smoke.py

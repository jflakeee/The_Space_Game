<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ore Belt</title>
<meta name="theme-color" content="#0c1230">
<meta name="description" content="소행성 채굴 + 타워 디펜스 웹게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1230;--panel:rgba(14,20,52,.86);--line:rgba(130,160,230,.28);--text:#d6def0;--dim:#8592b3;
  --ore:#e8a951;--en:#6fd6ec;--hos:#ff5a6e;--heal:#7ee0a0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Chakra Petch",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;touch-action:none}
button{font:inherit;color:var(--text);background:rgba(40,52,110,.75);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--en)}
button:focus-visible{outline:2px solid var(--en);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) 12px 14px;background:linear-gradient(var(--panel) 60%,rgba(14,20,52,0));
  pointer-events:none;font-size:13px}
#hud button{pointer-events:auto}
#hud button.stop{border-color:var(--ore);color:var(--ore)}
.res{display:flex;align-items:center;gap:6px}
.res b{font-size:18px;font-variant-numeric:tabular-nums;min-width:2.5ch}
.res small{color:var(--dim);font-variant-numeric:tabular-nums}
.sw{width:9px;height:9px;transform:rotate(45deg)}
.sw.ore{background:var(--ore)}.sw.en{background:var(--en)}
#enBar{width:56px;height:4px;background:rgba(255,255,255,.12)}#enBar i{display:block;height:100%;width:0;background:var(--en)}
.starved b{color:var(--hos)}
#waveV,#goalV{color:var(--dim)}#waveV b,#goalV b{color:var(--text);font-weight:600}
.ctl{margin-left:auto;display:flex;gap:6px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;overflow-x:auto;
  padding:16px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(14,20,52,0),var(--panel) 35%)}
.bb{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;min-width:74px;padding:6px 10px;text-align:left;line-height:1.25}
.bb .n{font-weight:600}.bb .c{font-size:12px;color:var(--ore)}
.bb.on{border-color:var(--en);background:rgba(55,88,170,.9)}
.bb.poor .c{color:var(--hos)}
#info{position:fixed;right:10px;bottom:86px;width:210px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
#info[hidden]{display:none}
#info .t{font-size:15px;font-weight:600}#info .d{color:var(--dim)}#info button{margin-top:8px;width:100%}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  padding:6px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,34,.8);padding:20px;overflow:auto}
#overlay[hidden]{display:none}
.card{max-width:480px;width:100%;margin:auto}
h1{font-size:52px;line-height:1;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
h1 i{font-style:normal;color:var(--ore)}
.card p{color:var(--dim);margin:0 0 20px;line-height:1.6}
.ms{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px}
.ms b{display:block;font-size:16px}.ms span{color:var(--dim);font-size:13px}
.ms em{display:block;font-style:normal;color:var(--ore);font-size:13px;letter-spacing:2px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .ms{margin:0}.ms.wide{grid-column:1/-1}
.prog{color:var(--dim);font-size:13px;margin:-8px 0 12px;display:flex;align-items:center;gap:6px}
.prog .lang{font-size:12px;padding:4px 10px}.prog #diffBtn{margin-left:auto}.prog b{color:var(--ore)}
#tip{position:fixed;left:50%;transform:translateX(-50%);width:min(460px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--en);
  border-radius:8px;padding:8px 8px 8px 12px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center}
#tip>span{color:var(--en);font-variant-numeric:tabular-nums;flex:0 0 auto}#tip>div{flex:1}#tip b{color:var(--ore)}
#tip button{flex:0 0 auto;font-size:12px;padding:4px 8px}
.bb.hint{border-color:var(--ore);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(232,169,81,.4)}}
.ms.daily{border-color:rgba(183,156,255,.6)}.ms.daily b{color:#d2c4ff}
.ms.resume{border-color:var(--en);margin-bottom:12px}
.cx{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.cx img{width:56px;height:56px;flex:0 0 56px;background:rgba(27,36,80,.6);border-radius:8px}
.cx b{display:block;font-size:15px}.cx small{color:var(--ore);font-size:12px;font-variant-numeric:tabular-nums}.cx p{margin:4px 0 0;font-size:13px;line-height:1.5}
.card h3{margin:20px 0 4px;font-size:14px;color:var(--en);font-weight:600}
.stars{color:var(--ore);font-size:28px;letter-spacing:6px;margin:0 0 6px}
.help{font-size:12px;color:var(--dim);line-height:1.7;margin-top:16px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 20px;font-variant-numeric:tabular-nums}
.stats dt{color:var(--dim)}.stats dd{margin:0}
@media (max-width:520px){#hud{font-size:12px;gap:4px 12px}#hud button{padding:5px 8px;font-size:12px}h1{font-size:42px}.res b{font-size:16px}#info{bottom:80px;width:190px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="res" id="oreBox"><span class="sw ore"></span><b id="oreV">0</b><small>광석</small></div>
  <div class="res" id="enBox"><span class="sw en"></span><b id="enV">0</b><div id="enBar"><i></i></div><small id="enR"></small></div>
  <div id="waveV"></div>
  <div id="goalV"></div>
  <div class="ctl">
    <button id="callBtn" title="다음 웨이브를 바로 부르고 남은 시간만큼 광석 보너스">웨이브 호출</button>
    <button id="muteBtn" title="효과음">소리 켜짐</button>
    <button id="spdBtn" title="게임 속도">1×</button>
    <button id="pauseBtn" title="일시정지 (Space)">일시정지</button>
  </div>
</div>
<div id="bar" hidden></div>
<div id="info" hidden></div>
<div id="toast"></div>
<div id="tip" hidden></div>
<div id="overlay"></div>

<script>
"use strict";
// ---------- config ----------
const W = 1800, H = 1200, ZMIN = 0.3, ZMAX = 2.5;
const RELAY = { core: 1, node: 1 };
const DEF = {

  slow:    { name: "감속탑", cost: 55, hp: 110, r: 12, build: 5, range: 110, slow: 0.5, use: 1.5, desc: "범위 내 적의 이동과 사격을 늦춤. 작동 중 에너지 소모." },
  repair:  { name: "수리소", cost: 70, hp: 120, r: 12, build: 6, range: 130, heal: 12, use: 2, desc: "범위 내 건물 수리. 수리 중 에너지 소모." },
};
const ORDER = ["node", "solar", "battery", "miner", "laser", "missile", "slow", "repair"];
const EN = {
  scout:  { hp: 40,  spd: 70, r: 7,  range: 80,  dmg: 5,  rof: 0.8, bounty: 4 },
  raider: { hp: 120, spd: 45, r: 10, range: 110, dmg: 12, rof: 1.2, bounty: 8 },
  heavy:  { hp: 420, spd: 28, r: 15, range: 140, dmg: 30, rof: 2.0, bounty: 20 },
  bomber: { hp: 60,  spd: 85, r: 8,  range: 0,   dmg: 45, rof: 0,   bounty: 6, blast: 45 },
  shield: { hp: 160, spd: 40, r: 12, range: 100, dmg: 8,  rof: 1.2, bounty: 12, aura: 95 },
  boss:   { hp: 1400, spd: 18, r: 30, range: 170, dmg: 25, rof: 0.7, bounty: 150 },
};
const MAXLV = 3;
function st(b, k) {
  const d = DEF[b.type], l = (b.lvl || 1) - 1;
  if (b.br === "rapid") switch (k) {
    case "dps": return 25 + 15 * l;
    case "range": return 125 + 10 * l;
    case "use": return 2.5 + 0.5 * l;
  }
  if (b.br === "lance") switch (k) {
    case "dmg": return 50 + 45 * l;
    case "range": return 180 + 40 * l;
    case "reload": return 1.5;
    case "shot": return 4 + 2 * l;
  }
  switch (k) {
    case "gen": return b.type === "core" ? 2 + 1.5 * l : d.gen * (1 + 0.5 * l);
    case "rate": case "dps": case "dmg": case "heal": return d[k] * (1 + 0.5 * l);
    case "use": return d.use * (1 + 0.25 * l);
    case "range": return d.range + (b.type === "missile" ? 20 : 15) * l;
    case "reload": return d.reload * (1 - 0.15 * l);
    case "cap": return d.cap * (1 + l);
    case "link": return d.link + 25 * l;
    case "hp": return Math.round(d.hp * (1 + 0.3 * l));
    case "slow": return Math.max(0.3, d.slow - 0.08 * l);
  }
  return d[k];
}
const upCost = (b, br = b.br) => Math.round((DEF[b.type].cost || 100) * (b.lvl === 1 ? 0.8 : 1.2) * (br === "lance" ? 1.6 : 1));
const BR = { rapid: () => L("속사", "Rapid"), lance: () => L("저격", "Lance") };
const BRD = { rapid: () => L("짧은 사거리, 높은 연속 피해. 사격 중 에너지 소모.", "Short range, high sustained damage. Uses energy while firing."), lance: () => L("긴 사거리. 범위 내 체력이 가장 높은 적에게 강한 단발. 발사마다 에너지 소모.", "Long range. Heavy single shots at the toughest target in range. Uses energy per shot.") };
const LINK_CAP = { core: 20, node: 8 }, capOf = b => LINK_CAP[b.type] || 2;
const refund = b => b.prog < 1 || b.type === "node" ? b.spent : Math.floor(b.spent * 0.5);
const DIFFS = [0.75, 1, 1.3];
let diffIdx = 1;
const ALL = null, NO_SLOW = ["node", "solar", "battery", "miner", "laser", "missile", "repair"];
const MISSIONS = [
  { name: "첫 채굴",      desc: "광석 300 채굴. 기본을 익히세요.",       goal: { ore: 300 },   firstWave: 90, gap: 60, diff: 0.6,  ore: 150, map: "scatter", allow: ["node", "solar", "miner", "laser"] },
  { name: "전력 부족",    desc: "광석 800 채굴. 배터리 해금.",           goal: { ore: 800 },   firstWave: 70, gap: 50, diff: 0.7,  ast: 22, map: "cluster", allow: ["node", "solar", "battery", "miner", "laser"] },
  { name: "버티기",       desc: "웨이브 6개 생존. 수리소 해금.",         goal: { waves: 6 },   firstWave: 60, gap: 42, diff: 0.8,  map: "ring",  allow: ["node", "solar", "battery", "miner", "laser", "repair"] },
  { name: "미사일 시험",  desc: "웨이브 8개 생존. 미사일 해금.",         goal: { waves: 8 },   firstWave: 55, gap: 40, diff: 0.9,  map: "scatter", allow: NO_SLOW },
  { name: "광맥 쟁탈",    desc: "광석 2000 채굴. 습격이 잦습니다.",      goal: { ore: 2000 },  firstWave: 45, gap: 35, diff: 0.9,  map: "cluster", allow: NO_SLOW },
  { name: "희박한 벨트",  desc: "광석 1500 채굴. 소행성이 적습니다.",    goal: { ore: 1500 },  firstWave: 50, gap: 38, diff: 1,    ast: 14, map: "scatter", allow: NO_SLOW },
  { name: "자폭 경보",    desc: "웨이브 10개 생존. 자폭선이 일찍 옵니다. 감속탑 해금.", goal: { waves: 10 }, firstWave: 55, gap: 38, diff: 1, w0: 1, map: "lanes", allow: ALL },
  { name: "실드 함대",    desc: "웨이브 12개 생존. 실드함 다수.",        goal: { waves: 12 },  firstWave: 60, gap: 36, diff: 1,    w0: 2, map: "ring", allow: ALL },
  { name: "고립 기지",    desc: "광석 2500 채굴. 적은 자금으로 시작.",   goal: { ore: 2500 },  firstWave: 40, gap: 30, diff: 1.1,  ore: 80, map: "cluster", allow: ALL },
  { name: "최후의 방어선", desc: "웨이브 15개 생존.",                    goal: { waves: 15 },  firstWave: 45, gap: 34, diff: 1.2,  map: "lanes", allow: ALL },
  { name: "무한 벨트",    desc: "끝없는 웨이브. 얼마나 버틸까요?",       goal: null,           firstWave: 40, gap: 32, diff: 1.1,  allow: ALL },
];
const COL = { bg: "#0c1230", ore: "#e8a951", en: "#6fd6ec", grid: "92,143,224", hos: "#ff5a6e", heal: "#7ee0a0", slow: "#b79cff",
  struct: "#cfd8ec", fill: "#1b2450", rock: "#37364f", rockEdge: "#57557a" };

// ---------- utils ----------
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy;
  const t = l ? clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / l, 0, 1) : 0;
  return Math.hypot(a.x + dx * t - p.x, a.y + dy * t - p.y);
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------- i18n ----------
const LANG = store.get("orebelt.lang") || ((navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "en");
const L = (ko, en) => LANG === "en" ? en : ko;
diffIdx = +(store.get("orebelt.diff") ?? 1);
if (LANG === "en") {
  const EN_B = {
    core: ["Core", "Base core. Produces energy; you lose if it is destroyed."],
    node: ["Relay", "Extends the power grid. Asteroids block links."],
    solar: ["Solar", "Generates energy."],
    battery: ["Battery", "Increases energy storage."],
    miner: ["Miner", "Mines ore from a nearby asteroid."],
    laser: ["Laser", "Short-range continuous damage. Uses energy while firing."],
    missile: ["Missile", "Long-range splash damage. Costs 2 ore per shot."],
    slow: ["Slow Field", "Slows enemy movement and fire in range. Uses energy while active."],
    repair: ["Repair Bay", "Repairs buildings in range. Uses energy while repairing."],
  };
  for (const k in EN_B) [DEF[k].name, DEF[k].desc] = EN_B[k];
  const EN_M = [
    ["First Dig", "Mine 300 ore. Learn the basics."],
    ["Power Shortage", "Mine 800 ore. Battery unlocked."],
    ["Hold Out", "Survive 6 waves. Repair Bay unlocked."],
    ["Missile Trial", "Survive 8 waves. Missile unlocked."],
    ["Vein Rush", "Mine 2000 ore. Frequent raids."],
    ["Thin Belt", "Mine 1500 ore. Few asteroids."],
    ["Bomber Alert", "Survive 10 waves. Bombers arrive early. Slow Field unlocked."],
    ["Shield Fleet", "Survive 12 waves. Many shield ships."],
    ["Isolated Base", "Mine 2500 ore. Low starting funds."],
    ["Last Line", "Survive 15 waves."],
    ["Endless Belt", "Endless waves. How long can you last?"],
  ];
  MISSIONS.forEach((m, i) => { [m.name, m.desc] = EN_M[i]; });
}
function applyStaticText() {
  document.documentElement.lang = LANG;
  $("oreBox").querySelector("small").textContent = L("광석", "ore");
  $("callBtn").textContent = L("웨이브 호출", "Call wave");
  $("callBtn").title = L("다음 웨이브를 바로 부르고 남은 시간만큼 광석 보너스", "Call the next wave now for an ore bonus");
  $("muteBtn").title = L("효과음", "Sound effects");
  $("spdBtn").title = L("게임 속도", "Game speed");
  $("pauseBtn").title = L("일시정지 (Space)", "Pause (Space)");
}
function setLang(l) { saveGame(); store.set("orebelt.lang", l); location.reload(); }

// ---------- audio (WebAudio synth) ----------
const AU = { ctx: null, master: null, noise: null, muted: store.get("orebelt.mute") === "1", last: {} };
function auInit() {
  if (AU.ctx) { if (AU.ctx.state === "suspended") AU.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    AU.ctx = new C(); AU.master = AU.ctx.createGain(); AU.master.gain.value = AU.muted ? 0 : 0.35; AU.master.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate, buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = buf;
  } catch { AU.ctx = null; }
}
addEventListener("pointerdown", auInit); addEventListener("keydown", auInit);
function tone(type, f0, f1, dur, vol, delay = 0) {
  const c = AU.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AU.master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, fq, delay = 0) {
  const c = AU.ctx, t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AU.noise; f.type = "lowpass"; f.frequency.setValueAtTime(fq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AU.master); s.start(t); s.stop(t + dur);
}
const SFX_GAP = { laser: 0.12, hit: 0.1, boom: 0.07, launch: 0.08, kill: 0.05, done: 0.1 };
function sfx(n) {
  if (!AU.ctx || AU.muted || AU.ctx.state !== "running") return;
  const now = AU.ctx.currentTime;
  if (SFX_GAP[n] && now - (AU.last[n] || 0) < SFX_GAP[n]) return;
  AU.last[n] = now;
  switch (n) {

          b.ast.ore -= m; S.ore += m; S.oreMined += m; b.beam = b.ast;
          if (Math.random() < dt * 5) { const g = b.ang + Math.PI; burst(b.ast.x + Math.cos(g) * b.ast.r * 0.7, b.ast.y + Math.sin(g) * b.ast.r * 0.7, 2, COL.ore, 50, 0.4, 1.5); }
          b.ast.r = b.ast.r0 * (0.45 + 0.55 * b.ast.ore / b.ast.ore0);
          if (b.ast.ore <= 0) depleted(b.ast);
        }
      }
    } else if (b.type === "laser" && b.br === "lance") {
      b.cd -= dt;
      let e = null;
      for (const x of S.enemies) if (!x.dead && dist(x, b) - x.r <= st(b, "range") && (!e || x.hp > e.hp)) e = x;
      if (e) {
        b.ang = Math.atan2(e.y - b.y, e.x - b.x);
        if (b.cd <= 0 && use(st(b, "shot"))) { b.cd = st(b, "reload"); hurt(e, st(b, "dmg")); b.shotT = 0.18; b.sx = e.x; b.sy = e.y; sfx("launch"); burst(e.x, e.y, 6, "#e9fbff", 120, 0.35, 2); }
      }
    } else if (b.type === "laser") {
      const e = nearestEnemy(b, st(b, "range"));
      if (e) { b.ang = Math.atan2(e.y - b.y, e.x - b.x); if (use(st(b, "use") * dt)) { hurt(e, st(b, "dps") * dt); b.beam = e; sfx("laser"); if (Math.random() < dt * 12) burst(e.x, e.y, 1, "#e9fbff", 90, 0.3, 1.5); } }
    } else if (b.type === "missile") {
      b.cd -= dt;
      const e = nearestEnemy(b, st(b, "range"));
      if (e) {
        b.ang = Math.atan2(e.y - b.y, e.x - b.x);
        if (b.cd <= 0 && S.ore >= d.ammo) {
          S.ore -= d.ammo; b.cd = st(b, "reload"); sfx("launch");
          S.shots.push({ kind: "m", x: b.x, y: b.y, vx: Math.cos(b.ang) * 90, vy: Math.sin(b.ang) * 90, spd: 110, tgt: e, dmg: st(b, "dmg"), splash: d.splash, life: 4 });
        }
      }
    } else if (b.type === "slow") {
      const R2 = st(b, "range"), f = st(b, "slow"), inR = S.enemies.filter(e => !e.dead && dist(e, b) - e.r <= R2);
      if (inR.length && use(st(b, "use") * dt)) { for (const e of inR) e.slowF = Math.min(e.slowF, f); b.beam = b; }
    } else if (b.type === "repair") {
      let t = null, worst = 0.999;
      for (const o of S.buildings) {
        if (o === b || o.prog < 1 || o.dead) continue;
        const f = o.hp / o.maxHp;
        if (f < worst && dist(o, b) <= st(b, "range")) { worst = f; t = o; }
      }
      if (t && use(st(b, "use") * dt)) { t.hp = Math.min(t.maxHp, t.hp + st(b, "heal") * dt); b.beam = t; }
    }
  }
  S.rateT += dt;
  if (S.rateT >= 1) { S.useRate = S.usedAcc / S.rateT; S.usedAcc = 0; S.rateT = 0; S.starved = Math.max(0, S.starved - 0.5); }

  // enemies (sim)
  for (const e of S.enemies) e.shielded = false;
  for (const sh of S.enemies) if (sh.kind === "shield" && !sh.dead)
    for (const e of S.enemies) if (e !== sh && Math.hypot(e.x - sh.x, e.y - sh.y) <= EN.shield.aura) e.shielded = true;
  for (const e of S.enemies) {
    if (e.dead) continue;
    const d = EN[e.kind];
    if (!e.tgt || e.tgt.dead || (e.rt -= dt) <= 0) { e.tgt = nearestBuilding(e); e.rt = 1.5; }
    if (!e.tgt) continue;
    const dx = e.tgt.x - e.x, dy = e.tgt.y - e.y, dd = Math.hypot(dx, dy) || 1;
    e.ang = Math.atan2(dy, dx);
    const sp = d.spd * (e.slowF || 1) * S.mod.spd;
    if (e.kind === "bomber") {
      e.x += dx / dd * sp * dt; e.y += dy / dd * sp * dt;
      if (dd <= e.r + e.tgt.r + 2) {
        e.dead = true; boom(e.x, e.y, d.blast, COL.hos); shake(4); sfx("boom");
        for (const b of S.buildings) if (Math.hypot(b.x - e.x, b.y - e.y) <= d.blast + b.r) damageB(b, d.dmg * S.dm);
      }
      continue;
    }
    if (e.kind === "boss" && (e.spawnT -= dt) <= 0) {
      e.spawnT = 8;
      for (let i = 0; i < 2; i++) S.enemies.push(mkE("scout", e.x + rand(-30, 30), e.y + rand(-30, 30), e.hpM));
    }
    if (dd > d.range * 0.85) { e.x += dx / dd * sp * dt; e.y += dy / dd * sp * dt; }
    else { e.x += -dy / dd * sp * 0.3 * dt * e.side; e.y += dx / dd * sp * 0.3 * dt * e.side; }
    e.cd -= dt * (0.4 + 0.6 * (e.slowF || 1));
    if (dd <= d.range && e.cd <= 0) {
      e.cd = d.rof;
      S.shots.push({ kind: "e", x: e.x, y: e.y, vx: 0, vy: 0, spd: 300, tgt: e.tgt, dmg: d.dmg * S.dm, life: 3 });
    }
  }

  // projectiles
  for (const s of S.shots) {
    if (s.dead) continue;
    if (s.tgt.dead) {
      const e = s.kind === "m" ? nearestEnemy(s, 220) : null;
      if (e) s.tgt = e; else { s.dead = true; continue; }
    }
    const dx = s.tgt.x - s.x, dy = s.tgt.y - s.y, dd = Math.hypot(dx, dy) || 1;
    if (s.kind === "m") s.spd = Math.min(340, s.spd + 400 * dt);
    if (dd <= s.spd * dt + s.tgt.r) {
      s.dead = true;
      if (s.kind === "m") {
        boom(s.tgt.x, s.tgt.y, s.splash, COL.ore); sfx("boom");
        const cx = s.tgt.x, cy = s.tgt.y, main = s.tgt;
        for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - cx, e.y - cy) <= s.splash + e.r) hurt(e, e === main ? s.dmg : s.dmg * 0.6);
      } else damageB(s.tgt, s.dmg);
      continue;
    }
    const k = Math.min(1, dt * 8);
    s.vx += (dx / dd * s.spd - s.vx) * k; s.vy += (dy / dd * s.spd - s.vy) * k;
    if (s.kind === "e") { s.vx = dx / dd * s.spd; s.vy = dy / dd * s.spd; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.kind === "m" && Math.random() < 0.6 && S.parts.length < 700) S.parts.push({ x: s.x, y: s.y, vx: rand(-15, 15), vy: rand(-15, 15), t: 0, max: 0.45, col: "#8d93ad", s: 2 });
    if ((s.life -= dt) <= 0) s.dead = true;
  }

  stepFx(dt);
  for (const b of S.buildings) if (b.flash > 0) b.flash -= dt;
  S.enemies = S.enemies.filter(e => !e.dead);
  S.shots = S.shots.filter(s => !s.dead);
  if (S.buildings.some(b => b.dead)) S.buildings = S.buildings.filter(b => !b.dead);
  if (S.asteroids.some(a => a.dead)) S.asteroids = S.asteroids.filter(a => !a.dead);
  if (S.over) return;

  // waves
  if (!wavesDone() && !(S.tut != null && S.tut < 4)) { S.waveT -= dt; if (S.waveT <= 0) { spawnWave(); S.waveT = S.m.gap; } }

  const g = S.m.goal;
  if (g && g.ore && S.oreMined >= g.ore) endGame(true);
  if (g && g.waves && wavesDone() && S.enemies.length === 0) endGame(true);
}

// ---------- draw ----------
function poly(n, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = rot + i / n * Math.PI * 2; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); }

}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function rangeOf(b) { const d = DEF[b.type]; return d.range ? st(b, "range") : d.link ? st(b, "link") : d.reach || 0; }

function drawB(b, ghostMode, ok) {
  const d = DEF[b.type];

  ctx.globalAlpha = ghostMode ? 0.7 : (b.prog < 1 ? 0.5 : 1);
  ctx.lineWidth = 1.6; ctx.strokeStyle = ghostMode && !ok ? COL.hos : COL.struct; ctx.fillStyle = COL.fill;
  switch (b.type) {

      poly(6, d.r, Math.PI / 6); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = COL.en; poly(6, d.r * 0.55, Math.PI / 6 + (S ? S.t : 0) * 0.4); ctx.stroke();
      circle(0, 0, 3); ctx.fillStyle = COL.en; ctx.fill(); break;
    case "node":
      poly(4, d.r, 0); ctx.fill(); ctx.strokeStyle = ghostMode && !ok ? COL.hos : `rgb(${COL.grid})`; ctx.stroke();
      circle(0, 0, 2); ctx.fillStyle = `rgb(${COL.grid})`; ctx.fill(); break;
    case "solar":
      ctx.fillRect(-d.r, -d.r * 0.75, d.r * 2, d.r * 1.5); ctx.strokeRect(-d.r, -d.r * 0.75, d.r * 2, d.r * 1.5);
      ctx.strokeStyle = COL.en; ctx.lineWidth = 1;
      ctx.beginPath(); for (let i = -1; i <= 1; i++) { ctx.moveTo(i * d.r * 0.5, -d.r * 0.75); ctx.lineTo(i * d.r * 0.5, d.r * 0.75); } ctx.moveTo(-d.r, 0); ctx.lineTo(d.r, 0); ctx.stroke(); break;
    case "battery": {
      ctx.fillRect(-d.r * 0.7, -d.r, d.r * 1.4, d.r * 2); ctx.strokeRect(-d.r * 0.7, -d.r, d.r * 1.4, d.r * 2);

      ctx.fillStyle = COL.en; ctx.fillRect(-d.r * 0.45, d.r * 0.8 - d.r * 1.6 * f, d.r * 0.9, d.r * 1.6 * f); break;
    }
    case "miner":
      circle(0, 0, d.r); ctx.fill(); ctx.stroke(); ctx.rotate(b.ang);
      ctx.beginPath(); ctx.moveTo(d.r + 6, 0); ctx.lineTo(d.r - 3, -5); ctx.lineTo(d.r - 3, 5); ctx.closePath(); ctx.fillStyle = COL.ore; ctx.fill(); break;
    case "laser":
      if (b.br === "lance") { poly(4, d.r * 1.1, 0); ctx.fill(); ctx.stroke(); } else { circle(0, 0, d.r); ctx.fill(); ctx.stroke(); }
      ctx.rotate(b.ang); ctx.strokeStyle = COL.en; ctx.beginPath();

      else if (b.br === "lance") { ctx.lineWidth = 2.5; ctx.moveTo(2, 0); ctx.lineTo(d.r + 14, 0); }
      else { ctx.lineWidth = 3.5; ctx.moveTo(2, 0); ctx.lineTo(d.r + 7, 0); }
      ctx.stroke(); break;
    case "missile":
      poly(8, d.r, Math.PI / 8); ctx.fill(); ctx.stroke(); ctx.rotate(b.ang);
      ctx.fillStyle = COL.ore; ctx.fillRect(-2, -7, d.r + 3, 4); ctx.fillRect(-2, 3, d.r + 3, 4); break;
    case "slow":
      circle(0, 0, d.r); ctx.fill(); ctx.stroke(); ctx.strokeStyle = COL.slow; ctx.lineWidth = 1.6;
      circle(0, 0, d.r * 0.55); ctx.stroke(); circle(0, 0, 2.5); ctx.fillStyle = COL.slow; ctx.fill(); break;
    case "repair":
      circle(0, 0, d.r); ctx.fill(); ctx.stroke();

function bar(x, y, w, f, col) {

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, cw, ch);
  const sk = S ? S.shake : 0, ox = rand(-sk, sk), oy = rand(-sk, sk);
  ctx.setTransform(dpr * cam.z, 0, 0, dpr * cam.z, dpr * (cw / 2 - cam.x * cam.z + ox), dpr * (ch / 2 - cam.y * cam.z + oy));
  for (const s of stars) { ctx.fillStyle = `rgba(200,215,255,${s.a})`; ctx.fillRect(s.x, s.y, s.s, s.s); }
  if (!S) return;
  const px = 1 / cam.z;
  ctx.strokeStyle = "rgba(120,150,220,.18)"; ctx.lineWidth = 2 * px; ctx.strokeRect(0, 0, W, H);

  // relay coverage in build mode
  if (S.build) {
    ctx.fillStyle = `rgba(${COL.grid},.06)`; ctx.strokeStyle = `rgba(${COL.grid},.2)`; ctx.lineWidth = px;
    for (const b of S.buildings) if (RELAY[b.type] && b.powered) { const f = (S.deg?.get(b) || 0) >= capOf(b); ctx.strokeStyle = f ? "rgba(255,90,110,.35)" : `rgba(${COL.grid},.2)`; ctx.fillStyle = f ? "rgba(255,90,110,.04)" : `rgba(${COL.grid},.06)`; circle(b.x, b.y, st(b, "link")); ctx.fill(); ctx.stroke(); }
  }

  // asteroids
  for (const a of S.asteroids) {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.beginPath();
    a.pts.forEach((k, i) => { const t = i / a.pts.length * Math.PI * 2, x = Math.cos(t) * a.r * k, y = Math.sin(t) * a.r * k; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fillStyle = COL.rock; ctx.fill(); ctx.strokeStyle = COL.rockEdge; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = COL.ore; ctx.globalAlpha = 0.3 + 0.55 * a.ore / a.ore0;
    for (const v of a.veins) { circle(v[0] * a.r, v[1] * a.r, v[2] * a.r); ctx.fill(); }
    ctx.restore();
  }

  // links
  ctx.lineWidth = 1.5 * px;
  for (const [a, b, ph] of S.links) {
    const live = a.powered && b.powered && (RELAY[a.type] ? a.prog >= 1 : true) && (RELAY[b.type] ? b.prog >= 1 : true);
    ctx.strokeStyle = `rgba(${COL.grid},${live ? 0.5 : 0.15})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    if (live) { const t = (S.t * 0.6 + ph) % 1; circle(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 1.8); ctx.fillStyle = COL.en; ctx.fill(); }
  }

  // beams
  for (const b of S.buildings) {
    if (!b.beam) continue;
    const t = b.beam;
    if (b.type === "miner") {
      const g = Math.atan2(t.y - b.y, t.x - b.x), ex = t.x - Math.cos(g) * t.r * 0.7, ey = t.y - Math.sin(g) * t.r * 0.7;
      ctx.strokeStyle = COL.ore; ctx.globalAlpha = 0.4 + Math.random() * 0.5; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(ex, ey); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (b.type === "laser") {
      ctx.strokeStyle = "#e9fbff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
      ctx.strokeStyle = COL.en; ctx.globalAlpha = 0.35; ctx.lineWidth = 6; ctx.stroke(); ctx.globalAlpha = 1;
    } else if (b.type === "slow") {
      const R2 = st(b, "range");
      for (let i = 0; i < 2; i++) { const k = (S.t * 0.7 + i * 0.5) % 1; ctx.globalAlpha = 0.35 * (1 - k); ctx.strokeStyle = COL.slow; ctx.lineWidth = 2; circle(b.x, b.y, R2 * k); ctx.stroke(); }
      ctx.globalAlpha = 1;
    } else if (b.type === "repair") {

    ctx.setLineDash([]); ctx.strokeStyle = COL.en; ctx.lineWidth = 2 * px;
    circle(S.sel.x, S.sel.y, S.sel.r + 8); ctx.stroke();

  for (const b of S.buildings) drawB(b, false);

  // enemies
  for (const e of S.enemies) {
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.ang);
    drawEnemyBody(e, S.t);
    ctx.restore();
    if (e.kind === "shield") { ctx.strokeStyle = "rgba(255,150,170,.2)"; ctx.lineWidth = 1 / cam.z; circle(e.x, e.y, EN.shield.aura); ctx.stroke(); }
    if (e.slowF < 1) { ctx.strokeStyle = COL.slow; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); circle(e.x, e.y, e.r + 7); ctx.stroke(); ctx.setLineDash([]); }
    if (e.shielded) { ctx.strokeStyle = "rgba(255,205,215,.75)"; ctx.lineWidth = 1.3; circle(e.x, e.y, e.r + 4); ctx.stroke(); }

    if (s.kind === "m") {
      ctx.strokeStyle = "rgba(232,169,81,.5)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.05, s.y - s.vy * 0.05); ctx.stroke();
      circle(s.x, s.y, 2.6); ctx.fillStyle = COL.ore; ctx.fill();
    } else { circle(s.x, s.y, 2); ctx.fillStyle = "#ffb0bb"; ctx.fill(); }
  }

  // fx
  for (const f of S.fx) {
    const k = f.t / f.max;
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.col; ctx.lineWidth = 2;
    circle(f.x, f.y, f.r * (0.3 + 0.7 * k)); ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const p of S.parts) { ctx.globalAlpha = 1 - p.t / p.max; ctx.fillStyle = p.col; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }

    if (r) { ctx.strokeStyle = c.ok ? "rgba(220,230,255,.4)" : "rgba(255,90,110,.4)"; ctx.setLineDash([6 * px, 6 * px]); circle(ghost.x, ghost.y, r); ctx.stroke(); ctx.setLineDash([]); }
    drawB({ type: S.build, x: ghost.x, y: ghost.y, r: DEF[S.build].r, ang: -Math.PI / 2, prog: 1 }, true, c.ok);
    if (!c.ok) reason = c.reason;
  }
  if (reason) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sx = (ghost.x - cam.x) * cam.z + cw / 2, sy = (ghost.y - cam.y) * cam.z + ch / 2;
    ctx.font = '12px "Chakra Petch", system-ui, sans-serif'; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(14,20,52,.85)"; const w = ctx.measureText(reason).width + 12;
    const tx = clamp(sx, w / 2 + 6, cw - w / 2 - 6), ty = clamp(sy + 22, 6, ch - 110);
    ctx.fillRect(tx - w / 2, ty, w, 20); ctx.fillStyle = COL.hos; ctx.fillText(reason, tx, ty + 14);
  }
}

// ---------- UI ----------
let toastTimer = 0;
function placeToast() { const tip = $("tip"); $("toast").style.top = (($("hud").hidden ? 20 : $("hud").offsetHeight) + (tip.hidden ? 0 : tip.offsetHeight + 8)) + "px"; }
function toast(msg, sec = 2.2) { const t = $("toast"); placeToast(); t.textContent = msg; t.style.opacity = 1; toastTimer = sec; }
function buildBar() {
  const bar = $("bar"); bar.innerHTML = "";

  if (e.key >= "1" && e.key <= "9" && S.allow[+e.key - 1]) { const k = S.allow[+e.key - 1]; setBuild(S.build === k ? null : k); }
  else if (e.key === "u" || e.key === "U") upgrade(S.sel);
  else if ((e.key === "r" || e.key === "R") && S.sel && S.sel.type === "laser" && S.sel.lvl === 1) upgrade(S.sel, "rapid");
  else if ((e.key === "l" || e.key === "L") && S.sel && S.sel.type === "laser" && S.sel.lvl === 1) upgrade(S.sel, "lance");
  else if (e.key === "Escape") { if (S.build || S.sel) { setBuild(null); select(null); } else setPause(true); }
  else if (e.key === " ") { e.preventDefault(); setSpeed(S.speed ? 0 : (S.lastSpd || 1)); }
});

// ---------- save / load ----------
const SAVE_KEY = "orebelt.save";
function saveGame() {
  if (!S || S.over || !S.core || S.core.dead) return;
  const data = { v: 1, mi: S.mi, t: S.t, ore: S.ore, energy: S.energy, oreMined: S.oreMined, wave: S.wave, waveT: S.waveT, kills: S.kills,
    ast: S.asteroids.map(a => [a.x, a.y, a.r, a.r0, a.ore, a.ore0, a.rot, a.pts, a.veins]),
    b: S.buildings.map(b => [b.type, b.x, b.y, b.hp, b.maxHp, b.prog, b.lvl, b.spent, b.cd, b.br || null]),
    e: S.enemies.map(e => [e.kind, e.x, e.y, e.hp, e.maxHp, e.hpM, e.cd, e.side, e.spawnT]),
    cam: [cam.x, cam.y, cam.z] };
  store.set(SAVE_KEY, JSON.stringify(data));
}
function readSave() { try { const d = JSON.parse(store.get(SAVE_KEY)); return d && d.v === 1 && (MISSIONS[d.mi] || d.mi === -1) ? d : null; } catch { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch {} }
function loadGame() {
  const d = readSave(); if (!d) return;
  newGame(d.mi, true);
  Object.assign(S, { t: d.t, ore: d.ore, energy: d.energy, oreMined: d.oreMined, wave: d.wave, waveT: d.waveT, kills: d.kills });
  S.asteroids = d.ast.map(([x, y, r, r0, ore, ore0, rot, pts, veins]) => ({ x, y, r, r0, ore, ore0, rot, pts, veins }));
  S.buildings = d.b.map(([type, x, y, hp, maxHp, prog, lvl, spent, cd, br]) => Object.assign(mkB(type, x, y, prog >= 1), { hp, maxHp, prog, lvl, spent, cd, br: br || null }));
  S.core = S.buildings.find(b => b.type === "core");
  if (!S.core) { clearSave(); newGame(d.mi); return; }
  S.enemies = d.e.map(([k, x, y, hp, maxHp, hpM, cd, side, spawnT]) => Object.assign(mkE(k, x, y, hpM), { hp, maxHp, cd, side, spawnT }));
  S.dirty = true;
  [cam.x, cam.y, cam.z] = d.cam;
  toast(`${L("이어하기", "Continue")}: ${S.m.name}`);
}
addEventListener("pagehide", saveGame);
document.addEventListener("visibilitychange", () => { if (document.hidden && S && !S.over) { saveGame(); if (!S.paused && $("overlay").hidden) setPause(true); } });

// ---------- pause ----------
function setPause(p) {
  if (!S || S.over) return;
  S.paused = p; updateCtl();
  const o = $("overlay");
  if (!p) { o.hidden = true; return; }
  saveGame(); toastTimer = 0; $("toast").style.opacity = 0;
  o.innerHTML = `<div class="card"><h1 style="font-size:36px">${L("일시정지", "Paused")}</h1><p>${S.m.goal ? S.mi + 1 + ". " : ""}${S.m.name}, ${L("웨이브", "wave")} ${S.wave}</p>
    <button class="ms" id="pResume"><b>${L("계속", "Resume")}</b></button><button class="ms" id="pRestart"><b>${L("다시 시작", "Restart")}</b></button><button class="ms" id="pCodex"><b>${L("도감", "Codex")}</b></button><button class="ms" id="pMenu"><b>${L("임무 선택", "Missions")}</b></button>
    <div class="help">${L("진행 상황은 자동 저장됩니다. 임무 선택 화면에서 이어할 수 있습니다.", "Progress is saved automatically. Continue from the mission screen.")}</div></div>`;
  o.hidden = false;
  $("pResume").onclick = () => setPause(false);
  $("pRestart").onclick = () => newGame(S.mi);
  $("pCodex").onclick = () => showCodex(() => setPause(true));
  $("pMenu").onclick = () => { saveGame(); showMenu(); };
}

// ---------- tutorial ----------
const has = k => S.buildings.some(b => b.type === k);
const TUT = [
  { text: L("아래에서 <b>채굴기</b>를 고르세요.", "Pick the <b>Miner</b> below."), hint: "miner", done: () => S.build === "miner" || has("miner") },
  { text: L("광석 반점이 있는 소행성 옆, 코어의 파란 범위 안에 놓으세요.", "Place it next to an ore-speckled asteroid, inside the core's blue range."), hint: "miner", done: () => has("miner") },
  { text: L("<b>태양광</b>으로 에너지를 늘리세요. 채굴기와 포탑은 에너지를 씁니다.", "Build <b>Solar</b> for more energy. Miners and turrets consume it."), hint: "solar", done: () => has("solar") },
  { text: L("<b>중계기</b>로 전력망을 넓히면 먼 소행성에도 닿습니다. 소행성은 연결선을 가립니다.", "<b>Relays</b> extend the grid to distant asteroids. Asteroids block links."), hint: "node", done: () => has("node") },
  { text: L("곧 해적이 옵니다. <b>레이저</b>를 코어 근처에 지으세요.", "Pirates are coming. Build a <b>Laser</b> near the core."), hint: "laser", done: () => has("laser") },
  { text: L("건물을 누르면 업그레이드와 판매를 할 수 있습니다. 목표는 광석 300입니다.", "Tap a building to upgrade or sell it. Goal: mine 300 ore."), hint: null, done: () => S.t - S.tutT > 8 },
];
function renderTip() {
  const tip = $("tip"), step = S && S.tut != null && !S.over ? TUT[S.tut] : null;
  for (const b of $("bar").children) b.classList.toggle("hint", !!step && b.dataset.k === step.hint);
  if (!step) { tip.hidden = true; return; }
  tip.innerHTML = `<span>${S.tut + 1}/${TUT.length}</span><div>${step.text}</div><button id="tipSkip">${L("건너뛰기", "Skip")}</button>`;
  tip.style.top = $("hud").offsetHeight + "px"; tip.hidden = false;
  $("tipSkip").onclick = () => { S.tut = null; renderTip(); };
}
function tutTick() {
  if (!S || S.tut == null || S.over) return;
  if (TUT[S.tut].done()) { S.tut++; S.tutT = S.t; if (S.tut >= TUT.length) S.tut = null; else sfx("done"); renderTip(); }
}

// ---------- codex ----------
const EINFO = {
  scout:  { n: () => L("정찰기", "Scout"),   d: () => L("빠르고 약합니다. 수가 많으니 속사 레이저로 정리하세요.", "Fast and fragile, but numerous. Rapid lasers clean them up.") },
  raider: { n: () => L("약탈선", "Raider"),  d: () => L("주력 전투함. 레이저 사거리 근처에서 교전합니다.", "The backbone of a raid. Fights near laser range.") },
  heavy:  { n: () => L("중형선", "Heavy"),   d: () => L("느리지만 단단하고 사거리가 깁니다. 저격 레이저나 미사일로 상대하세요.", "Slow, tough and long-ranged. Counter with Lance lasers or missiles.") },
  bomber: { n: () => L("자폭선", "Bomber"),  d: () => L("가장 가까운 건물로 돌진해 범위 폭발합니다. 감속탑과 외곽 레이저로 접근 전에 처치하세요.", "Rams the nearest building and explodes. Slow fields and outer lasers stop it early.") },
  shield: { n: () => L("실드함", "Shield Ship"), d: () => L("주변 아군이 받는 피해를 절반으로 줄입니다. 실드함 자신은 보호받지 못하니 먼저 노리세요.", "Halves damage taken by nearby allies, but not itself. Kill it first.") },
  boss:   { n: () => L("모함", "Mothership"), d: () => L("5웨이브마다 등장. 체력이 매우 높고 정찰기를 계속 내보냅니다. 저격 레이저가 효과적입니다.", "Every 5th wave. Huge HP, keeps launching scouts. Lance lasers excel.") },
};
function drawEnemyBody(e, t) {
  ctx.fillStyle = COL.hos; ctx.strokeStyle = "#ffc2ca"; ctx.lineWidth = 1.2;
  if (e.kind === "bomber") {
    const k = 0.5 + 0.5 * Math.sin(t * 12);
    poly(4, e.r * 1.25, 0); ctx.fill(); ctx.stroke();
    ctx.fillStyle = `rgba(255,220,120,${0.35 + 0.65 * k})`; circle(0, 0, e.r * 0.45); ctx.fill();
  } else if (e.kind === "shield") {
    poly(6, e.r, 0); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#ffe0e5"; circle(0, 0, e.r * 0.3); ctx.fill();
  } else if (e.kind === "boss") {
    ctx.beginPath(); ctx.moveTo(e.r * 1.2, 0); ctx.lineTo(e.r * 0.2, -e.r * 0.6); ctx.lineTo(-e.r, -e.r * 0.9); ctx.lineTo(-e.r * 0.7, 0);
    ctx.lineTo(-e.r, e.r * 0.9); ctx.lineTo(e.r * 0.2, e.r * 0.6); ctx.closePath();
    ctx.fill(); ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = "#5a1a2a"; circle(-e.r * 0.1, 0, e.r * 0.3); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(e.r * 1.3, 0); ctx.lineTo(-e.r, -e.r * 0.85); ctx.lineTo(-e.r * 0.5, 0); ctx.lineTo(-e.r, e.r * 0.85); ctx.closePath();
    ctx.fill(); ctx.stroke();
    if (e.kind === "heavy") { ctx.fillStyle = "#5a1a2a"; circle(0, 0, e.r * 0.35); ctx.fill(); }
  }
}
function iconURL(fn, size = 56) {
  const c = document.createElement("canvas"); c.width = c.height = size * 2;
  const old = ctx; ctx = c.getContext("2d");
  try { ctx.setTransform(2, 0, 0, 2, size, size); fn(); } finally { ctx = old; }
  return c.toDataURL();
}
function bIcon(type, br) { const r = DEF[type].r, sc = Math.min(1.6, 20 / r); return iconURL(() => { ctx.scale(sc, sc); drawB({ type, x: 0, y: 0, r, ang: -Math.PI / 4, prog: 1, br, lvl: 1, powered: true, hp: 1, maxHp: 1 }, false); }); }
function eIcon(kind) { const r = EN[kind].r, sc = Math.min(1.8, 18 / r); return iconURL(() => { ctx.scale(sc, sc); ctx.rotate(-Math.PI / 2); drawEnemyBody({ kind, r }, 0.2); }); }
function showCodex(back) {
  const o = $("overlay"), row = (img, title, sub, body) => `<div class="cx"><img src="${img}" alt=""><div><b>${title}</b><small>${sub}</small><p>${body}</p></div></div>`;
  const bRows = ["core", ...ORDER].map(k => { const d = DEF[k];
    const stat = [d.cost ? `${L("비용", "Cost")} ${d.cost}` : "", `${L("내구도", "HP")} ${d.hp}`, d.range ? `${L("사거리", "Range")} ${d.range}` : "", d.link ? `${L("연결", "Links")} ${LINK_CAP[k]}` : ""].filter(Boolean).join(" · ");
    return row(bIcon(k), d.name, stat, d.desc); }).join("")
    + row(bIcon("laser", "rapid"), `${DEF.laser.name} (${BR.rapid()})`, "Lv 2+", BRD.rapid())
    + row(bIcon("laser", "lance"), `${DEF.laser.name} (${BR.lance()})`, "Lv 2+", BRD.lance());
  const eRows = Object.keys(EN).map(k => { const d = EN[k];
    const stat = [`${L("체력", "HP")} ${d.hp}`, `${L("속도", "Speed")} ${d.spd}`, d.range ? `${L("사거리", "Range")} ${d.range}` : L("근접 자폭", "Melee blast")].join(" · ");
    return row(eIcon(k), EINFO[k].n(), stat, EINFO[k].d()); }).join("");
  o.innerHTML = `<div class="card"><h1 style="font-size:36px">${L("도감", "Codex")}</h1>
    <h3>${L("건물", "Buildings")}</h3>${bRows}<h3>${L("적", "Enemies")}</h3>${eRows}
    <p class="help">${L("적 체력은 웨이브와 난이도에 따라 늘어납니다.", "Enemy HP scales with wave and difficulty.")}</p>
    <button class="ms" id="cxBack"><b>${L("돌아가기", "Back")}</b></button></div>`;
  o.hidden = false; o.scrollTop = 0;
  $("cxBack").onclick = back;
}
function seenHint(kind) {
  let seen = []; try { seen = JSON.parse(store.get("orebelt.seen")) || []; } catch {}
  if (seen.includes(kind)) return;
  seen.push(kind); store.set("orebelt.seen", JSON.stringify(seen));
  toast(`${L("새 적", "New enemy")}: ${EINFO[kind].n()}. ${EINFO[kind].d()}`, 6);
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S && !S.paused && !S.over) { let t = dt * S.speed; while (t > 1e-6) { const s = Math.min(t, 0.025); update(s); t -= s; if (S.over) break; } }
  else if (S && S.over) stepFx(dt);
  if (S && S.shake > 0) S.shake = Math.max(0, S.shake - dt * 30);
  draw(); hudTick(dt); musicTick();
  requestAnimationFrame(frame);
}
applyStaticText();
showMenu();
requestAnimationFrame(frame);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
window.__game = { get S() { return S; }, newGame, update, setBuild, tryPlace, checkPlace, upgrade, DEF, MISSIONS, setGhostWorld(x, y) { ghost = { x, y }; } };
</script>

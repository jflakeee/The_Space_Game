<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ore Belt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1230;--panel:rgba(14,20,52,.86);--line:rgba(130,160,230,.28);--text:#d6def0;--dim:#8592b3;
  --ore:#e8a951;--en:#6fd6ec;--hos:#ff5a6e;--heal:#7ee0a0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Chakra Petch",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;touch-action:none}
button{font:inherit;color:var(--text);background:rgba(40,52,110,.75);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--en)}
button:focus-visible{outline:2px solid var(--en);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) 12px 14px;background:linear-gradient(var(--panel) 60%,rgba(14,20,52,0));
  pointer-events:none;font-size:13px}
#hud button{pointer-events:auto}
.res{display:flex;align-items:center;gap:6px}
.res b{font-size:18px;font-variant-numeric:tabular-nums;min-width:2.5ch}
.res small{color:var(--dim);font-variant-numeric:tabular-nums}
.sw{width:9px;height:9px;transform:rotate(45deg)}
.sw.ore{background:var(--ore)}.sw.en{background:var(--en)}
#enBar{width:56px;height:4px;background:rgba(255,255,255,.12)}#enBar i{display:block;height:100%;width:0;background:var(--en)}
.starved b{color:var(--hos)}
#waveV,#goalV{color:var(--dim)}#waveV b,#goalV b{color:var(--text);font-weight:600}
.ctl{margin-left:auto;display:flex;gap:6px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;overflow-x:auto;
  padding:16px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(14,20,52,0),var(--panel) 35%)}
.bb{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;min-width:74px;padding:6px 10px;text-align:left;line-height:1.25}
.bb .n{font-weight:600}.bb .c{font-size:12px;color:var(--ore)}
.bb.on{border-color:var(--en);background:rgba(55,88,170,.9)}
.bb.poor .c{color:var(--hos)}
#info{position:fixed;right:10px;bottom:86px;width:210px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
#info[hidden]{display:none}
#info .t{font-size:15px;font-weight:600}#info .d{color:var(--dim)}#info button{margin-top:8px;width:100%}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  padding:6px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,34,.8);padding:20px;overflow:auto}
#overlay[hidden]{display:none}
.card{max-width:480px;width:100%;margin:auto}
h1{font-size:52px;line-height:1;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
h1 i{font-style:normal;color:var(--ore)}
.card p{color:var(--dim);margin:0 0 20px;line-height:1.6}
.ms{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px}
.ms b{display:block;font-size:16px}.ms span{color:var(--dim);font-size:13px}
.ms em{display:block;font-style:normal;color:var(--ore);font-size:13px;letter-spacing:2px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .ms{margin:0}.ms.wide{grid-column:1/-1}
.prog{color:var(--dim);font-size:13px;margin:-8px 0 12px}.prog b{color:var(--ore)}
#tip{position:fixed;left:50%;transform:translateX(-50%);width:min(460px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--en);
  border-radius:8px;padding:8px 8px 8px 12px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center}
#tip>span{color:var(--en);font-variant-numeric:tabular-nums;flex:0 0 auto}#tip>div{flex:1}#tip b{color:var(--ore)}
#tip button{flex:0 0 auto;font-size:12px;padding:4px 8px}
.bb.hint{border-color:var(--ore);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(232,169,81,.4)}}
.ms.resume{border-color:var(--en);margin-bottom:12px}
.stars{color:var(--ore);font-size:28px;letter-spacing:6px;margin:0 0 6px}
.help{font-size:12px;color:var(--dim);line-height:1.7;margin-top:16px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 20px;font-variant-numeric:tabular-nums}
.stats dt{color:var(--dim)}.stats dd{margin:0}
@media (max-width:520px){h1{font-size:42px}.res b{font-size:16px}#info{bottom:80px;width:190px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="res" id="oreBox"><span class="sw ore"></span><b id="oreV">0</b><small>광석</small></div>
  <div class="res" id="enBox"><span class="sw en"></span><b id="enV">0</b><div id="enBar"><i></i></div><small id="enR"></small></div>
  <div id="waveV"></div>
  <div id="goalV"></div>
  <div class="ctl">
    <button id="callBtn" title="다음 웨이브를 바로 부르고 남은 시간만큼 광석 보너스">웨이브 호출</button>
    <button id="muteBtn" title="효과음">소리 켜짐</button>
    <button id="spdBtn" title="게임 속도">1×</button>
    <button id="pauseBtn" title="일시정지 (Space)">일시정지</button>
  </div>
</div>
<div id="bar" hidden></div>
<div id="info" hidden></div>
<div id="toast"></div>
<div id="tip" hidden></div>
<div id="overlay"></div>

<script>
"use strict";
// ---------- config ----------
const W = 1800, H = 1200, ZMIN = 0.3, ZMAX = 2.5;
const RELAY = { core: 1, node: 1 };
const DEF = {
  core:    { name: "코어",   cost: 0,  hp: 600, r: 22, link: 160, build: 0, desc: "기지 본체. 에너지 +2/s. 파괴되면 패배." },
  node:    { name: "중계기", cost: 15, hp: 80,  r: 8,  link: 150, build: 2, desc: "전력망을 확장. 소행성이 연결을 가립니다." },
  solar:   { name: "태양광", cost: 30, hp: 90,  r: 12, build: 4, gen: 1.6, desc: "에너지 생산." },
  battery: { name: "배터리", cost: 50, hp: 100, r: 11, build: 4, cap: 100, desc: "에너지 저장량 증가." },
  miner:   { name: "채굴기", cost: 40, hp: 110, r: 11, build: 5, use: 0.6, rate: 2.2, reach: 70, desc: "가까운 소행성에서 광석 채굴." },
  laser:   { name: "레이저", cost: 60, hp: 140, r: 12, build: 6, range: 140, dps: 22, use: 2.5, desc: "근거리 지속 피해. 사격 중 에너지 소모." },
  missile: { name: "미사일", cost: 90, hp: 150, r: 13, build: 8, range: 240, dmg: 45, splash: 45, reload: 2.2, ammo: 2, desc: "장거리 범위 피해. 발사당 광석 2." },
  repair:  { name: "수리소", cost: 70, hp: 120, r: 12, build: 6, range: 130, heal: 12, use: 2, desc: "범위 내 건물 수리. 수리 중 에너지 소모." },
};
const ORDER = ["node", "solar", "battery", "miner", "laser", "missile", "repair"];
const EN = {
  scout:  { hp: 40,  spd: 70, r: 7,  range: 80,  dmg: 5,  rof: 0.8, bounty: 4 },
  raider: { hp: 120, spd: 45, r: 10, range: 110, dmg: 12, rof: 1.2, bounty: 8 },
  heavy:  { hp: 420, spd: 28, r: 15, range: 140, dmg: 30, rof: 2.0, bounty: 20 },
  bomber: { hp: 60,  spd: 85, r: 8,  range: 0,   dmg: 60, rof: 0,   bounty: 6, blast: 45 },
  shield: { hp: 160, spd: 40, r: 12, range: 100, dmg: 8,  rof: 1.2, bounty: 12, aura: 95 },
  boss:   { hp: 1800, spd: 18, r: 30, range: 170, dmg: 25, rof: 0.7, bounty: 150 },
};
const MAXLV = 3;
function st(b, k) {
  const d = DEF[b.type], l = (b.lvl || 1) - 1;
  switch (k) {
    case "gen": return b.type === "core" ? 2 + 1.5 * l : d.gen * (1 + 0.5 * l);
    case "rate": case "dps": case "dmg": case "heal": return d[k] * (1 + 0.5 * l);
    case "use": return d.use * (1 + 0.25 * l);
    case "range": return d.range + (b.type === "missile" ? 20 : 15) * l;
    case "reload": return d.reload * (1 - 0.15 * l);
    case "cap": return d.cap * (1 + l);
    case "link": return d.link + 25 * l;
    case "hp": return Math.round(d.hp * (1 + 0.3 * l));
  }
  return d[k];
}
const upCost = b => Math.round((DEF[b.type].cost || 100) * (b.lvl === 1 ? 0.8 : 1.2));
const ALL = null;
const MISSIONS = [
  { name: "첫 채굴",      desc: "광석 300 채굴. 기본을 익히세요.",       goal: { ore: 300 },   firstWave: 90, gap: 60, diff: 0.6,  ore: 150, allow: ["node", "solar", "miner", "laser"] },
  { name: "전력 부족",    desc: "광석 800 채굴. 배터리 해금.",           goal: { ore: 800 },   firstWave: 70, gap: 50, diff: 0.7,  ast: 22, allow: ["node", "solar", "battery", "miner", "laser"] },
  { name: "버티기",       desc: "웨이브 6개 생존. 수리소 해금.",         goal: { waves: 6 },   firstWave: 60, gap: 42, diff: 0.8,  allow: ["node", "solar", "battery", "miner", "laser", "repair"] },
  { name: "미사일 시험",  desc: "웨이브 8개 생존. 미사일 해금.",         goal: { waves: 8 },   firstWave: 55, gap: 40, diff: 0.9,  allow: ALL },
  { name: "광맥 쟁탈",    desc: "광석 2000 채굴. 습격이 잦습니다.",      goal: { ore: 2000 },  firstWave: 45, gap: 35, diff: 0.9,  allow: ALL },
  { name: "자폭 경보",    desc: "웨이브 10개 생존. 자폭선이 일찍 옵니다.", goal: { waves: 10 }, firstWave: 50, gap: 38, diff: 1,    w0: 2, allow: ALL },
  { name: "희박한 벨트",  desc: "광석 1500 채굴. 소행성이 적습니다.",    goal: { ore: 1500 },  firstWave: 50, gap: 38, diff: 1,    ast: 14, allow: ALL },
  { name: "실드 함대",    desc: "웨이브 12개 생존. 실드함 다수.",        goal: { waves: 12 },  firstWave: 45, gap: 36, diff: 1.05, w0: 3, allow: ALL },
  { name: "고립 기지",    desc: "광석 2500 채굴. 적은 자금으로 시작.",   goal: { ore: 2500 },  firstWave: 40, gap: 30, diff: 1.1,  ore: 80, allow: ALL },
  { name: "최후의 방어선", desc: "웨이브 15개 생존.",                    goal: { waves: 15 },  firstWave: 45, gap: 34, diff: 1.2,  allow: ALL },
  { name: "무한 벨트",    desc: "끝없는 웨이브. 얼마나 버틸까요?",       goal: null,           firstWave: 40, gap: 32, diff: 1.1,  allow: ALL },
];
const COL = { bg: "#0c1230", ore: "#e8a951", en: "#6fd6ec", grid: "92,143,224", hos: "#ff5a6e", heal: "#7ee0a0",
  struct: "#cfd8ec", fill: "#1b2450", rock: "#37364f", rockEdge: "#57557a" };

// ---------- utils ----------
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy;
  const t = l ? clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / l, 0, 1) : 0;
  return Math.hypot(a.x + dx * t - p.x, a.y + dy * t - p.y);
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------- audio (WebAudio synth) ----------
const AU = { ctx: null, master: null, noise: null, muted: store.get("orebelt.mute") === "1", last: {} };
function auInit() {
  if (AU.ctx) { if (AU.ctx.state === "suspended") AU.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    AU.ctx = new C(); AU.master = AU.ctx.createGain(); AU.master.gain.value = AU.muted ? 0 : 0.35; AU.master.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate, buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = buf;
  } catch { AU.ctx = null; }
}
addEventListener("pointerdown", auInit); addEventListener("keydown", auInit);
function tone(type, f0, f1, dur, vol, delay = 0) {
  const c = AU.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AU.master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, fq, delay = 0) {
  const c = AU.ctx, t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AU.noise; f.type = "lowpass"; f.frequency.setValueAtTime(fq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AU.master); s.start(t); s.stop(t + dur);
}
const SFX_GAP = { laser: 0.12, hit: 0.1, boom: 0.07, launch: 0.08, kill: 0.05, done: 0.1 };
function sfx(n) {
  if (!AU.ctx || AU.muted || AU.ctx.state !== "running") return;
  const now = AU.ctx.currentTime;
  if (SFX_GAP[n] && now - (AU.last[n] || 0) < SFX_GAP[n]) return;
  AU.last[n] = now;
  switch (n) {
    case "laser": tone("sawtooth", 1400, 700, 0.07, 0.03); break;
    case "launch": noise(0.25, 0.1, 2500); tone("square", 300, 120, 0.2, 0.035); break;
    case "boom": noise(0.35, 0.28, 1200); tone("sine", 120, 40, 0.3, 0.18); break;
    case "bigboom": noise(0.9, 0.5, 900); tone("sine", 90, 25, 0.8, 0.35); break;
    case "kill": noise(0.15, 0.12, 3000); tone("square", 600, 150, 0.12, 0.04); break;
    case "hit": tone("square", 180, 90, 0.08, 0.05); break;
    case "place": tone("triangle", 520, 780, 0.08, 0.12); break;
    case "done": tone("sine", 660, 660, 0.07, 0.08); tone("sine", 990, 990, 0.1, 0.08, 0.07); break;
    case "up": [523, 659, 784].forEach((f, i) => tone("triangle", f, f, 0.12, 0.12, i * 0.07)); break;
    case "err": tone("square", 160, 120, 0.12, 0.07); break;
    case "alarm": for (let i = 0; i < 2; i++) tone("square", 520, 380, 0.22, 0.06, i * 0.28); break;
    case "win": [523, 659, 784, 1046].forEach((f, i) => tone("triangle", f, f, 0.25, 0.14, i * 0.12)); break;
    case "lose": [392, 330, 262, 196].forEach((f, i) => tone("sawtooth", f, f * 0.98, 0.3, 0.07, i * 0.18)); break;
  }
}
function setMute(m) {
  AU.muted = m; store.set("orebelt.mute", m ? "1" : "0");
  if (AU.master) AU.master.gain.value = m ? 0 : 0.35;
  $("muteBtn").textContent = m ? "소리 꺼짐" : "소리 켜짐";
}

// ---------- particles / shake ----------
function burst(x, y, n, col, spd = 120, life = 0.6, size = 2) {
  if (!S) return;
  for (let i = 0; i < n && S.parts.length < 700; i++) {
    const a = rand(0, 6.28), v = rand(0.2, 1) * spd;
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, max: rand(0.5, 1) * life, col, s: rand(0.6, 1.4) * size });
  }
}
function shake(a) { if (S) S.shake = Math.min(14, S.shake + a); }
function stepFx(dt) {
  for (const f of S.fx) f.t += dt;
  S.fx = S.fx.filter(f => f.t < f.max);
  const k = Math.max(0, 1 - 2 * dt);
  for (const p of S.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= k; p.vy *= k; }
  S.parts = S.parts.filter(p => p.t < p.max);
}

// ---------- canvas / camera ----------
const cv = $("c"), ctx = cv.getContext("2d");
let cw, ch, dpr;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = innerWidth; ch = innerHeight;
  cv.width = cw * dpr; cv.height = ch * dpr;
  cv.style.width = cw + "px"; cv.style.height = ch + "px";
}
addEventListener("resize", resize); resize();
const cam = { x: W / 2, y: H / 2, z: 1 };
const s2w = (x, y) => [(x - cw / 2) / cam.z + cam.x, (y - ch / 2) / cam.z + cam.y];
function clampCam() { cam.x = clamp(cam.x, 0, W); cam.y = clamp(cam.y, 0, H); }

const stars = Array.from({ length: 320 }, () => ({ x: rand(-300, W + 300), y: rand(-300, H + 300), s: rand(0.8, 2.2), a: rand(0.15, 0.7) }));

// ---------- world gen ----------
function makeAst(x, y, r) {
  const n = 9 + (Math.random() * 5 | 0);
  const ore = Math.round(r * r * 0.9);
  return { x, y, r, r0: r, ore, ore0: ore, rot: rand(0, 6.28),
    pts: Array.from({ length: n }, () => rand(0.8, 1.12)),
    veins: Array.from({ length: 3 + (Math.random() * 3 | 0) }, () => { const a = rand(0, 6.28), d = rand(0, 0.55); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.08, 0.16)]; }) };
}
function genAsteroids(count = 30) {
  const A = [], cx = W / 2, cy = H / 2;
  const add = (x, y, r) => {
    if (x < r + 30 || x > W - r - 30 || y < r + 30 || y > H - r - 30) return;
    if (Math.hypot(x - cx, y - cy) < r + 90) return;
    for (const a of A) if (Math.hypot(a.x - x, a.y - y) < a.r + r + 40) return;
    A.push(makeAst(x, y, r));
  };
  for (let k = 0; A.length < 4 && k < 500; k++) { const g = rand(0, 6.28), d = rand(140, 230); add(cx + Math.cos(g) * d, cy + Math.sin(g) * d, rand(20, 30)); }
  for (let k = 0; A.length < count && k < 4000; k++) add(rand(0, W), rand(0, H), rand(16, 48));
  return A;
}

// ---------- state ----------
let S = null, uid = 1, ghost = null;
function mkB(type, x, y, built) {
  const d = DEF[type];
  return { id: uid++, type, x, y, r: d.r, maxHp: d.hp, hp: built ? d.hp : d.hp * 0.3, prog: built ? 1 : 0,
    lvl: 1, spent: d.cost, powered: false, cd: 0, ast: null, beam: null, ang: -Math.PI / 2, dead: false };
}
function newGame(mi, silent = false) {
  const m = MISSIONS[mi];
  S = { mi, m, t: 0, ore: m.ore ?? 120, allow: m.allow || ORDER, energy: 60, eCap: 150, oreMined: 0, wave: 0, waveT: m.firstWave,
    asteroids: genAsteroids(m.ast || 30), buildings: [], enemies: [], shots: [], fx: [], parts: [], shake: 0, links: [],
    dirty: true, speed: 1, paused: false, over: null, kills: 0, build: null, sel: null,
    gen: 0, usedAcc: 0, rateT: 0, useRate: 0, starved: 0 };
  S.core = mkB("core", W / 2, H / 2, true);
  S.buildings.push(S.core);
  cam.x = W / 2; cam.y = H / 2; cam.z = clamp(Math.min(cw / 760, ch / 600), 0.45, 1.4);
  ghost = null;

// ---------- combat helpers ----------

// ---------- update ----------
function update(dt) {

  let gen = st(S.core, "gen"), cap = 150; S.energy += gen * dt;

      if (b.ast) {

        for (const b of S.buildings) if (Math.hypot(b.x - e.x, b.y - e.y) <= d.blast + b.r) damageB(b, d.dmg * S.m.diff);

// ---------- draw ----------

function draw() {

  for (const [a, b, ph] of S.links) {
    const live = a.powered && b.powered && (RELAY[a.type] ? a.prog >= 1 : true) && (RELAY[b.type] ? b.prog >= 1 : true);
    ctx.strokeStyle = `rgba(${COL.grid},${live ? 0.5 : 0.15})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    if (live) { const t = (S.t * 0.6 + ph) % 1; circle(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 1.8); ctx.fillStyle = COL.en; ctx.fill(); }
  }

    if (!b.beam) continue;

      const g = Math.atan2(t.y - b.y, t.x - b.x), ex = t.x - Math.cos(g) * t.r * 0.7, ey = t.y - Math.sin(g) * t.r * 0.7;
      ctx.strokeStyle = COL.ore; ctx.globalAlpha = 0.4 + Math.random() * 0.5; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(ex, ey); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (b.type === "laser") {
      ctx.strokeStyle = "#e9fbff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
      ctx.strokeStyle = COL.en; ctx.globalAlpha = 0.35; ctx.lineWidth = 6; ctx.stroke(); ctx.globalAlpha = 1;
    } else if (b.type === "repair") {
      ctx.strokeStyle = COL.heal; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.lineDashOffset = -S.t * 20;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke(); ctx.setLineDash([]);

  // selected range
  if (S.sel) {
    const r = rangeOf(S.sel);

    if (r) { circle(S.sel.x, S.sel.y, r); ctx.stroke(); }
    ctx.setLineDash([]); ctx.strokeStyle = COL.en; ctx.lineWidth = 2 * px;

  for (const b of S.buildings) drawB(b, false);

  // enemies
  for (const e of S.enemies) {
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.ang);
    ctx.fillStyle = COL.hos; ctx.strokeStyle = "#ffc2ca"; ctx.lineWidth = 1.2;
    if (e.kind === "bomber") {
      const k = 0.5 + 0.5 * Math.sin(S.t * 12);
      ctx.fillStyle = `rgb(255,${Math.round(90 + 90 * k)},70)`; poly(4, e.r * 1.25, 0); ctx.fill(); ctx.stroke();
    } else if (e.kind === "shield") {
      poly(6, e.r, 0); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#ffe0e5"; circle(0, 0, e.r * 0.3); ctx.fill();
    } else if (e.kind === "boss") {
      ctx.beginPath(); ctx.moveTo(e.r * 1.2, 0); ctx.lineTo(e.r * 0.2, -e.r * 0.6); ctx.lineTo(-e.r, -e.r * 0.9); ctx.lineTo(-e.r * 0.7, 0);
      ctx.lineTo(-e.r, e.r * 0.9); ctx.lineTo(e.r * 0.2, e.r * 0.6); ctx.closePath();
      ctx.fill(); ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = "#5a1a2a"; circle(-e.r * 0.1, 0, e.r * 0.3); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(e.r * 1.3, 0); ctx.lineTo(-e.r, -e.r * 0.85); ctx.lineTo(-e.r * 0.5, 0); ctx.lineTo(-e.r, e.r * 0.85); ctx.closePath();
      ctx.fill(); ctx.stroke();
      if (e.kind === "heavy") { ctx.fillStyle = "#5a1a2a"; circle(0, 0, e.r * 0.35); ctx.fill(); }
    }
    ctx.restore();
    if (e.kind === "shield") { ctx.strokeStyle = "rgba(255,150,170,.2)"; ctx.lineWidth = 1 / cam.z; circle(e.x, e.y, EN.shield.aura); ctx.stroke(); }
    if (e.shielded) { ctx.strokeStyle = "rgba(255,205,215,.75)"; ctx.lineWidth = 1.3; circle(e.x, e.y, e.r + 4); ctx.stroke(); }
    if (e.hp < e.maxHp) bar(e.x, e.y - e.r - 7, e.r * 2, e.hp / e.maxHp, COL.hos);
  }

  // shots
  for (const s of S.shots) {
    if (s.kind === "m") {
      ctx.strokeStyle = "rgba(232,169,81,.5)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.05, s.y - s.vy * 0.05); ctx.stroke();
      circle(s.x, s.y, 2.6); ctx.fillStyle = COL.ore; ctx.fill();
    } else { circle(s.x, s.y, 2); ctx.fillStyle = "#ffb0bb"; ctx.fill(); }
  }

  // fx
  for (const f of S.fx) {
    const k = f.t / f.max;
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.col; ctx.lineWidth = 2;
    circle(f.x, f.y, f.r * (0.3 + 0.7 * k)); ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const p of S.parts) { ctx.globalAlpha = 1 - p.t / p.max; ctx.fillStyle = p.col; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;

  // ghost
  let reason = "";

    const c = checkPlace(S.build, ghost.x, ghost.y), r = rangeOf({ type: S.build });
    ctx.lineWidth = px * 1.5;
    for (const b of c.links) { ctx.strokeStyle = c.ok ? "rgba(126,224,160,.7)" : "rgba(255,90,110,.6)"; ctx.beginPath(); ctx.moveTo(ghost.x, ghost.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    if (r) { ctx.strokeStyle = c.ok ? "rgba(220,230,255,.4)" : "rgba(255,90,110,.4)"; ctx.setLineDash([6 * px, 6 * px]); circle(ghost.x, ghost.y, r); ctx.stroke(); ctx.setLineDash([]); }
    drawB({ type: S.build, x: ghost.x, y: ghost.y, r: DEF[S.build].r, ang: -Math.PI / 2, prog: 1 }, true, c.ok);
    if (!c.ok) reason = c.reason;
  }
  if (reason) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sx = (ghost.x - cam.x) * cam.z + cw / 2, sy = (ghost.y - cam.y) * cam.z + ch / 2;
    ctx.font = '12px "Chakra Petch", system-ui, sans-serif'; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(14,20,52,.85)"; const w = ctx.measureText(reason).width + 12;
    ctx.fillRect(sx - w / 2, sy + 22, w, 20); ctx.fillStyle = COL.hos; ctx.fillText(reason, sx, sy + 36);
  }
}

// ---------- input ----------
const ptrs = new Map();
let gest = null;
function setGhost(sx, sy, touch) { const [x, y] = s2w(sx, sy - (touch ? 56 : 0)); ghost = { x, y }; }
function tap(sx, sy) {

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    gest = { mode: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: cam.z, m0: s2w((a.x + b.x) / 2, (a.y + b.y) / 2) };

  const mode = S && S.build && !panBtn ? "ghost" : "pan";
  gest = { mode, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, touch: e.pointerType !== "mouse" };
  if (mode === "ghost") setGhost(e.clientX, e.clientY, gest.touch);

cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) { if (e.pointerType === "mouse" && S && S.build) setGhost(e.clientX, e.clientY, false); return; }
  const p = ptrs.get(e.pointerId); p.x = e.clientX; p.y = e.clientY;
  if (!gest) return;
  if (gest.mode === "pinch") {
    if (ptrs.size < 2) return;
    const [a, b] = [...ptrs.values()];
    cam.z = clamp(gest.z0 * Math.hypot(a.x - b.x, a.y - b.y) / gest.d0, ZMIN, ZMAX);
    cam.x = gest.m0[0] - ((a.x + b.x) / 2 - cw / 2) / cam.z;
    cam.y = gest.m0[1] - ((a.y + b.y) / 2 - ch / 2) / cam.z;
    clampCam(); return;
  }
  if (Math.hypot(e.clientX - gest.sx, e.clientY - gest.sy) > 6) gest.moved = true;
  if (gest.mode === "pan") { cam.x -= (e.clientX - gest.lx) / cam.z; cam.y -= (e.clientY - gest.ly) / cam.z; clampCam(); }
  else setGhost(e.clientX, e.clientY, gest.touch);
  gest.lx = e.clientX; gest.ly = e.clientY;
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (!gest) return;
  if (gest.mode === "pinch") { if (ptrs.size === 0) gest = null; return; }
  if (e.type === "pointerup") {
    if (gest.mode === "ghost") { tryPlace(); if (gest.touch) ghost = null; }
    else if (!gest.moved) tap(e.clientX, e.clientY);

}
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && !ptrs.size) ghost = null; });
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const [wx, wy] = s2w(e.clientX, e.clientY);
  cam.z = clamp(cam.z * Math.exp(-e.deltaY * 0.0015), ZMIN, ZMAX);
  cam.x = wx - (e.clientX - cw / 2) / cam.z; cam.y = wy - (e.clientY - ch / 2) / cam.z; clampCam();
}, { passive: false });
addEventListener("keydown", e => {
  if (!S || S.over) return;
  if (S.paused && $("pResume") && !$("overlay").hidden) {
    if (e.key === " " || e.key === "Escape") { e.preventDefault(); setPause(false); }
    return;
  }
  if (!$("overlay").hidden) return;
  if (e.key >= "1" && e.key <= "9" && S.allow[+e.key - 1]) { const k = S.allow[+e.key - 1]; setBuild(S.build === k ? null : k); }
  else if (e.key === "u" || e.key === "U") upgrade(S.sel);
  else if (e.key === "Escape") { if (S.build || S.sel) { setBuild(null); select(null); } else setPause(true); }
  else if (e.key === " ") { e.preventDefault(); setPause(true); }
});

// ---------- save / load ----------
const SAVE_KEY = "orebelt.save";
function saveGame() {
  if (!S || S.over || !S.core || S.core.dead) return;
  const data = { v: 1, mi: S.mi, t: S.t, ore: S.ore, energy: S.energy, oreMined: S.oreMined, wave: S.wave, waveT: S.waveT, kills: S.kills,
    ast: S.asteroids.map(a => [a.x, a.y, a.r, a.r0, a.ore, a.ore0, a.rot, a.pts, a.veins]),
    b: S.buildings.map(b => [b.type, b.x, b.y, b.hp, b.maxHp, b.prog, b.lvl, b.spent, b.cd]),
    e: S.enemies.map(e => [e.kind, e.x, e.y, e.hp, e.maxHp, e.hpM, e.cd, e.side, e.spawnT]),
    cam: [cam.x, cam.y, cam.z] };
  store.set(SAVE_KEY, JSON.stringify(data));
}
function readSave() { try { const d = JSON.parse(store.get(SAVE_KEY)); return d && d.v === 1 && MISSIONS[d.mi] ? d : null; } catch { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch {} }
function loadGame() {
  const d = readSave(); if (!d) return;
  newGame(d.mi, true);
  Object.assign(S, { t: d.t, ore: d.ore, energy: d.energy, oreMined: d.oreMined, wave: d.wave, waveT: d.waveT, kills: d.kills });
  S.asteroids = d.ast.map(([x, y, r, r0, ore, ore0, rot, pts, veins]) => ({ x, y, r, r0, ore, ore0, rot, pts, veins }));
  S.buildings = d.b.map(([type, x, y, hp, maxHp, prog, lvl, spent, cd]) => Object.assign(mkB(type, x, y, prog >= 1), { hp, maxHp, prog, lvl, spent, cd }));
  S.core = S.buildings.find(b => b.type === "core");
  if (!S.core) { clearSave(); newGame(d.mi); return; }
  S.enemies = d.e.map(([k, x, y, hp, maxHp, hpM, cd, side, spawnT]) => Object.assign(mkE(k, x, y, hpM), { hp, maxHp, cd, side, spawnT }));
  S.dirty = true;
  [cam.x, cam.y, cam.z] = d.cam;
  toast(`이어하기: ${S.m.name}`);
}
addEventListener("pagehide", saveGame);
document.addEventListener("visibilitychange", () => { if (document.hidden && S && !S.over) { saveGame(); if (!S.paused && $("overlay").hidden) setPause(true); } });

// ---------- pause ----------
function setPause(p) {
  if (!S || S.over) return;
  S.paused = p; updateCtl();
  const o = $("overlay");
  if (!p) { o.hidden = true; return; }
  saveGame();
  o.innerHTML = `<div class="card"><h1 style="font-size:36px">일시정지</h1><p>${S.m.goal ? S.mi + 1 + ". " : ""}${S.m.name}, 웨이브 ${S.wave}</p>
    <button class="ms" id="pResume"><b>계속</b></button><button class="ms" id="pRestart"><b>다시 시작</b></button><button class="ms" id="pMenu"><b>임무 선택</b></button>
    <div class="help">진행 상황은 자동 저장됩니다. 임무 선택 화면에서 이어할 수 있습니다.</div></div>`;
  o.hidden = false;
  $("pResume").onclick = () => setPause(false);
  $("pRestart").onclick = () => newGame(S.mi);
  $("pMenu").onclick = () => { saveGame(); showMenu(); };
}

// ---------- tutorial ----------
const has = k => S.buildings.some(b => b.type === k);
const TUT = [
  { text: "아래에서 <b>채굴기</b>를 고르세요.", hint: "miner", done: () => S.build === "miner" || has("miner") },
  { text: "광석 반점이 있는 소행성 옆, 코어의 파란 범위 안에 놓으세요.", hint: "miner", done: () => has("miner") },
  { text: "<b>태양광</b>으로 에너지를 늘리세요. 채굴기와 포탑은 에너지를 씁니다.", hint: "solar", done: () => has("solar") },
  { text: "<b>중계기</b>로 전력망을 넓히면 먼 소행성에도 닿습니다. 소행성은 연결선을 가립니다.", hint: "node", done: () => has("node") },
  { text: "곧 해적이 옵니다. <b>레이저</b>를 코어 근처에 지으세요.", hint: "laser", done: () => has("laser") },
  { text: "건물을 누르면 업그레이드와 판매를 할 수 있습니다. 목표는 광석 300입니다.", hint: null, done: () => S.t - S.tutT > 8 },
];
function renderTip() {
  const tip = $("tip"), step = S && S.tut != null && !S.over ? TUT[S.tut] : null;
  for (const b of $("bar").children) b.classList.toggle("hint", !!step && b.dataset.k === step.hint);
  if (!step) { tip.hidden = true; return; }
  tip.innerHTML = `<span>${S.tut + 1}/${TUT.length}</span><div>${step.text}</div><button id="tipSkip">건너뛰기</button>`;
  tip.style.top = $("hud").offsetHeight + "px"; tip.hidden = false;
  $("tipSkip").onclick = () => { S.tut = null; renderTip(); };
}
function tutTick() {
  if (!S || S.tut == null || S.over) return;
  if (TUT[S.tut].done()) { S.tut++; S.tutT = S.t; if (S.tut >= TUT.length) S.tut = null; else sfx("done"); renderTip(); }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S && !S.paused && !S.over) { let t = dt * S.speed; while (t > 1e-6) { const s = Math.min(t, 0.025); update(s); t -= s; if (S.over) break; } }
  else if (S && S.over) stepFx(dt);
  if (S && S.shake > 0) S.shake = Math.max(0, S.shake - dt * 30);
  draw(); hudTick(dt);
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
window.__game = { get S() { return S; }, newGame, update, setBuild, tryPlace, setGhostWorld(x, y) { ghost = { x, y }; } };
</script>

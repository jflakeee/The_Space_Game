<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ore Belt</title>
<meta name="theme-color" content="#0c1230">
<meta name="description" content="소행성 채굴 + 타워 디펜스 웹게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" role="img" aria-label="Ore Belt game field"></canvas>

<div id="hud" hidden>
  <div class="res" id="oreBox"><span class="sw ore"></span><b id="oreV">0</b><small>광석</small></div>
  <div class="res" id="enBox"><span class="sw en"></span><b id="enV">0</b><div id="enBar"><i></i></div><small id="enR"></small></div>
  <div id="waveV"></div>
  <div id="goalV"></div>
  <div class="ctl">
    <button id="callBtn" title="다음 웨이브를 바로 부르고 남은 시간만큼 광석 보너스">웨이브 호출</button>
    <button id="muteBtn" title="효과음">소리 켜짐</button>
    <button id="spdBtn" title="게임 속도">1×</button>
    <button id="pauseBtn" title="일시정지 (Space)">일시정지</button>
  </div>
</div>
<div id="bar" hidden></div>
<div id="info" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sndHint" hidden></div>
<div id="tip" hidden></div>
<div id="edinfo" hidden></div>
<div id="edbar" hidden></div>
<div id="rpinfo" hidden></div>
<div id="rpbar" hidden></div>
<div id="place" hidden><button id="plOk"></button><button id="plNo" aria-label="cancel">✕</button></div>
<button id="homeBtn" hidden></button>
<div id="overlay"></div>

<!-- 로드 순서가 중요합니다: 각 파일은 앞 파일의 전역 선언을 사용합니다 -->
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/daily.js"></script>
<script src="js/world.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/save.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/codex.js"></script>
<script src="js/settings.js"></script>
<script src="js/achievements.js"></script>
<script src="js/editor.js"></script>
<script src="js/story.js"></script>
<script src="js/replay.js"></script>
<script src="js/main.js"></script>
</body>
</html>

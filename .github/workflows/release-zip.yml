# Release automation: when APP_VERSION in js/config.js changes on main, create tag vX.Y.Z and a GitHub
# release (notes = that version's CHANGELOG.md section), and attach the itch.io-ready web zip.
# Also runs when a release is published by hand, and self-heals a missing zip.
name: release-zip
on:
  release:
    types: [published]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Create release for the current version if missing, attach zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'APP_VERSION = "\K[^"]+' js/config.js)
          TAG="v$VER"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md \
              | sed 's/^### \(.*\)/**\1**/' > notes.md
            printf 'Play: https://jflakeee.github.io/The_Space_Game/\n\n' | cat - notes.md > body.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Ore Belt $VER" --notes-file body.md
          fi
          NAME="ore-belt-v$VER-web.zip"
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$NAME"; then echo "$NAME already attached"; exit 0; fi
          zip -qr "$NAME" . -x '.git/*' '.github/*' 'tests/*' 'CHANGELOG.md' '*.py' 'notes.md' 'body.md' 'node_modules/*'
          gh release upload "$TAG" "$NAME"
